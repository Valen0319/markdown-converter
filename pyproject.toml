[project]
name = "md-converter-portable"
version = "1.0.0"
description = "Conversor personal de documentos varios a Markdown"
requires-python = ">=3.11"
dependencies = [
  "markitdown[all]>=0.1.2",
  "customtkinter>=5.2.2",
  "Pillow>=11.0.0",
  "tkinterdnd2>=0.4.3",
]

[tool.pytest.ini_options]
addopts = "-q"
